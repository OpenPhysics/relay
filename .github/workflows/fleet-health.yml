name: Fleet Health

# Org-wide health check: clone every active npm repo and run the same scripts
# as ci.yml (lint, check / typecheck, build, test), then publish a pass/fail
# table to the job summary. A missing script is a skip, not a failure. Catches
# a repo that a shared-workflow or dependency change quietly broke. Read-only —
# uses the default token to clone public repos.
#
# npm-only: it runs `npm ci`/`npm run <script>`, so only repos whose language
# includes JavaScript or TypeScript are in scope (Python repos like pycd48
# aren't covered here).
#
# Runs one repo per matrix job so they execute in parallel with isolated logs;
# `discover` builds the repo list from the catalog and `report` aggregates the
# per-repo rows into a single table.

on:
  schedule:
    - cron: '0 7 * * 1' # Mondays 07:00 UTC, just after the 06:00 compliance audit
  workflow_dispatch:
    inputs:
      repos:
        description: 'Optional space/comma-separated repos to limit the run (default: all active npm repos)'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: fleet-health
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Build the repo matrix
        id: list
        env:
          ONLY: ${{ inputs.repos }}
        run: |
          set -euo pipefail
          if [ -n "${ONLY:-}" ]; then
            matrix=$(echo "$ONLY" | tr ', ' '\n' | sed '/^$/d' | jq -R . | jq -cs .)
          else
            matrix=$(jq -c '[
              .repos[]
              | select(
                  .status == "active"
                  and .name != "relay"
                  and ((.language // []) | any(. == "JavaScript" or . == "TypeScript"))
                )
              | .name
            ]' structure/repos.json)
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  health:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sim: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          # Mirrors the fleet Node default — bump all setup-node workflows together.
          # See relay/README.md ("Node version").
          node-version: '24'

      # Sims are cloned into a mktemp dir, so setup-node's lockfile-based cache does
      # not apply. Cache the shared ~/.npm download dir per sim so repeat runs skip
      # re-downloading the (largely shared) dependency set. The run_id in the primary
      # key makes every run save a fresh entry while restore-keys reuses the last one.
      - name: Cache npm downloads
        uses: actions/cache@v6.1.0
        with:
          path: ~/.npm
          key: fleet-health-npm-${{ runner.os }}-${{ matrix.sim }}-${{ github.run_id }}
          restore-keys: |
            fleet-health-npm-${{ runner.os }}-${{ matrix.sim }}-
            fleet-health-npm-${{ runner.os }}-

      - name: Lint / type-check / build / test ${{ matrix.sim }}
        env:
          GH_TOKEN: ${{ github.token }}
          SIM: ${{ matrix.sim }}
        run: |
          set -uo pipefail
          dir="$(mktemp -d)"
          trap 'rm -rf "$dir"' EXIT
          if ! gh repo clone "${{ github.repository_owner }}/$SIM" "$dir" -- --depth 1 --quiet; then
            echo "| $SIM | ❌ clone | — | — | — | — |" | tee "row-$SIM.md"
            exit 1
          fi
          # pipefail so a failing probe still fails this step after tee writes the row.
          scripts/fleet-health-repo.sh --name "$SIM" "$dir" | tee "row-$SIM.md"

      - name: Upload row
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: health-row-${{ matrix.sim }}
          path: row-${{ matrix.sim }}.md
          if-no-files-found: ignore

  report:
    needs: [discover, health]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download rows
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: health-row-*
          path: rows
          merge-multiple: true

      - name: Assemble report
        run: |
          set -euo pipefail
          {
            echo "# Fleet health report"
            echo
            echo "| Repo | Install | Lint | Type-check | Build | Test |"
            echo "|---|:--:|:--:|:--:|:--:|:--:|"
            find rows -name '*.md' -exec cat {} + 2>/dev/null | sort || true
          } >> "$GITHUB_STEP_SUMMARY"

          # Fail when a health job failed, including a crash that never wrote a row.
          if [ "${{ needs.discover.result }}" != "success" ]; then
            echo "Could not build the repo list." >&2
            exit 1
          fi
          if [ "${{ needs.health.result }}" != "success" ] && [ "${{ needs.health.result }}" != "skipped" ]; then
            echo "One or more repos failed — see the table above." >&2
            exit 1
          fi
          if find rows -name '*.md' -exec cat {} + 2>/dev/null | grep -q '❌'; then
            echo "One or more repos failed — see the table above." >&2
            exit 1
          fi
